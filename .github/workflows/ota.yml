name: Build Web OTA Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ota:
    name: Build Jarvis Command Center Web OTA Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Unit Tests
        run: npm test

      - name: Build TypeScript Code
        run: npm run build

      - name: Build OTA Bundle & Manifest
        run: node scripts/build-ota.mjs

      - name: Upload OTA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ota-bundle
          path: |
            www/ota-manifest.json
            www/ota-bundle.json
