name: CI

# Filet de sécurité rapide et dédié : exécute uniquement la suite de tests
# backend (npm test), sans dépendre des builds Android/OTA plus lourds
# (voir android.yml et ota.yml). Ce workflow doit être configuré comme
# "required status check" dans la protection de branche de `main` pour
# bloquer la fusion en cas d'échec.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run npm test
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://jarvis:jarvis@127.0.0.1:5432/jarvis_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jarvis -d jarvis_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test
